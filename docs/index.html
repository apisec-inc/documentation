<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APIsec Documentation</title>
<style>
body {
    font-family: "Roboto", "Arial", sans-serif;
    background: #f6f8fb;
    display: flex;
    justify-content: center;
    align-items: center;
    height:100vh;
    margin:0;
}
.container {
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    text-align:center;
    width:480px;
}
h1 { margin-bottom:10px; color:#263238; font-weight:600; }
p { color:#546e7a; margin-bottom:25px; }
.button { display:block; padding:14px; margin:12px 0; border-radius:6px; text-decoration:none; font-weight:600; transition:all 0.3s ease; }
.primary { background:#2962ff; color:white; }
.primary:hover { background:#0039cb; }
.secondary { background:#e0e0e0; color:#263238; }
.secondary:hover { background:#bdbdbd; }
.timer { margin-top:15px; font-size:14px; color:#78909c; }
.progress-container { width:100%; height:6px; background:#e0e0e0; border-radius:10px; margin-top:15px; overflow:hidden; }
.progress { height:100%; background:#2962ff; width:100%; transition:width 0.1s linear; }
p.note { font-size:13px; color:#888; margin-top:20px; }
</style>
</head>
<body>
<div class="container">
<h1>APIsec Documentation</h1>
<p>Looking for <strong>Next-Gen platform documentation</strong>?</p>
<a class="button primary" href="https://docs.apisecapps.com">Go to Next-Gen Documentation</a>
<a class="button secondary" href="https://docs.apisec.ai/overview/">Continue to Current-Gen Documentation</a>
<div class="timer">Redirecting to Next-Gen documentation in <strong><span id="count">10</span></strong> seconds</div>
<div class="progress-container"><div class="progress"></div></div>
<p class="note">Current-Gen platform will be decommissioned soon.</p>
</div>
<script>
let seconds=10; let progressBar=document.querySelector(".progress"); let countDisplay=document.getElementById("count");
let interval=setInterval(()=>{
    seconds--;
    countDisplay.innerText=seconds;
    progressBar.style.width=(seconds/10)*100+"%";
    if(seconds<=0){clearInterval(interval);window.location.replace("https://docs.apisecapps.com");}
},1000);
document.querySelectorAll("a").forEach(btn=>btn.addEventListener("click",()=>clearInterval(interval)));
</script>
</body>
</html>
